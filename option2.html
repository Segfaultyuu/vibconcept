<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>METAL GRADES · 金属材质等级索引</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --steel-0:#0b0d10;
  --steel-1:#131820;
  --steel-2:#1c232d;
  --steel-3:#2a333f;
  --line:rgba(150,180,210,.13);
  --line-hot:rgba(62,224,255,.5);
  --cyan:#3ee0ff;
  --text:#dfe7ef;
  --dim:rgba(223,231,239,.44);
  --faint:rgba(223,231,239,.17);

  --tech:"Chakra Petch",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --han:"Noto Sans SC","PingFang SC",sans-serif;

  --accent:#d08a52;
  --accent-soft:rgba(208,138,82,.4);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--steel-0);color:var(--text);
  font-family:var(--mono);user-select:none;
  -webkit-font-smoothing:antialiased;
}

/* ───────── 背景：工程网格 + 金属反光 + 扫描线 ───────── */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg::before{  /* 网格 */
  content:"";position:absolute;inset:0;opacity:.5;
  background-image:
    linear-gradient(to right, var(--line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--line) 1px, transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(110% 85% at 50% 48%, #000 25%, transparent 78%);
  -webkit-mask-image:radial-gradient(110% 85% at 50% 48%, #000 25%, transparent 78%);
}
.bg::after{  /* 材质光 + 当前等级染色 */
  content:"";position:absolute;inset:0;
  transition:background 1s cubic-bezier(.4,0,.2,1);
  background:
    radial-gradient(52% 40% at 50% 44%, var(--accent-soft), transparent 70%),
    linear-gradient(118deg, rgba(62,224,255,.06) 0%, transparent 34%, rgba(255,255,255,.035) 52%, transparent 70%),
    radial-gradient(120% 90% at 50% 118%, #05070a, transparent 60%);
}
.scanlines{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px);
  mix-blend-mode:multiply;
}
.edge{ /* 四边金属压边 */
  position:fixed;inset:0;z-index:9;pointer-events:none;
  border:1px solid rgba(150,180,210,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.6);
}

/* ───────── 顶部系统条 ───────── */
header{
  position:fixed;top:0;left:0;right:0;z-index:8;
  height:52px;padding:0 clamp(14px,2.6vw,30px);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:linear-gradient(180deg, rgba(19,24,32,.92), rgba(19,24,32,.4));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
.sys-l{display:flex;align-items:center;gap:12px;min-width:0}
.dot{
  width:7px;height:7px;border-radius:50%;background:var(--cyan);flex:0 0 auto;
  box-shadow:0 0 10px var(--cyan);animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
.sys-title{
  font-family:var(--tech);font-weight:700;font-size:13px;
  letter-spacing:.26em;text-transform:uppercase;white-space:nowrap;
}
.sys-sub{
  font-size:9.5px;letter-spacing:.2em;color:var(--dim);white-space:nowrap;
  padding-left:12px;border-left:1px solid var(--line);
}
.sys-r{display:flex;align-items:center;gap:clamp(10px,2vw,22px);font-size:9.5px;letter-spacing:.18em;color:var(--dim)}
.counter{font-family:var(--tech);font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--text)}
.counter b{color:var(--cyan)}

/* ───────── 瞄准框 ───────── */
.reticle{
  position:fixed;left:50%;top:50%;z-index:4;pointer-events:none;
  width:clamp(280px,40vmin,440px);aspect-ratio:1/1;
  /* 上移约半个名牌高度，让十字中心对准球心而不是卡片中心 */
  transform:translate(-50%,calc(-50% - 48px));
}
.brk{position:absolute;width:26px;height:26px;border:1.5px solid var(--line-hot);opacity:.85}
.brk.tl{top:0;left:0;border-right:0;border-bottom:0}
.brk.tr{top:0;right:0;border-left:0;border-bottom:0}
.brk.bl{bottom:0;left:0;border-right:0;border-top:0}
.brk.br{bottom:0;right:0;border-left:0;border-top:0}
.reticle.lock .brk{animation:snap .42s cubic-bezier(.2,1.4,.3,1)}
@keyframes snap{
  0%{transform:scale(1.5);opacity:0}
  100%{transform:scale(1);opacity:.85}
}
.ring{position:absolute;inset:4%;animation:cw 34s linear infinite}
.ring2{position:absolute;inset:14%;animation:ccw 22s linear infinite}
@keyframes cw{to{transform:rotate(360deg)}}
@keyframes ccw{to{transform:rotate(-360deg)}}
.ring svg,.ring2 svg{width:100%;height:100%;display:block}
.xh{position:absolute;background:var(--line-hot);opacity:.5}
.xh.h{left:-14px;right:-14px;top:50%;height:1px}
.xh.v{top:-14px;bottom:-14px;left:50%;width:1px}
.xh.h::after,.xh.v::after{content:""}

/* ───────── 舞台 ───────── */
.stage{
  position:relative;z-index:5;height:100%;
  display:flex;align-items:center;overflow:hidden;
  touch-action:pan-y;cursor:grab;
}
.stage.dragging{cursor:grabbing}
.track{display:flex;align-items:center;will-change:transform;
  transition:transform .72s cubic-bezier(.2,.9,.2,1)}
.track.nosnap{transition:none}

.card{
  flex:0 0 auto;
  width:clamp(250px,33vw,420px);
  padding:0 clamp(8px,1.6vw,22px);
  display:flex;flex-direction:column;align-items:center;
  opacity:.2;transform:scale(.62);
  filter:grayscale(.65) brightness(.72);
  transition:opacity .62s cubic-bezier(.2,.9,.2,1), transform .62s cubic-bezier(.2,.9,.2,1), filter .62s;
}
.card.near{opacity:.42;transform:scale(.74);filter:grayscale(.4) brightness(.84)}
.card.active{opacity:1;transform:scale(1);filter:none}

/* ───────── 球体 ───────── */
.orb{position:relative;width:100%;aspect-ratio:1/1;display:grid;place-items:center;cursor:pointer}
.orb-in{position:relative;width:84%;aspect-ratio:1/1;animation:hover 8s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(-1%)}50%{transform:translateY(1.4%)}}

.glow{
  position:absolute;left:50%;top:50%;width:140%;aspect-ratio:1/1;transform:translate(-50%,-50%);
  background:radial-gradient(circle,var(--accent) 0%,transparent 60%);
  opacity:.12;filter:blur(30px);transition:opacity .5s;pointer-events:none;
}
.card.active .glow{opacity:.26}
.orb:hover .glow{opacity:.46}

.spin{position:absolute;inset:0;transform-origin:50% 50%}
.orb:hover .spin{animation:turn 9s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}

.orb img{
  display:block;width:100%;height:100%;object-fit:contain;
  -webkit-user-drag:none;transition:filter .45s;
}
.card.active .orb img{filter:drop-shadow(0 6px 26px rgba(0,0,0,.75))}

/* 扫描带：用图片自身做遮罩，只在球体上扫过 */
.scan{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  mask-size:contain;mask-position:center;mask-repeat:no-repeat;
  -webkit-mask-size:contain;-webkit-mask-position:center;-webkit-mask-repeat:no-repeat;
  background:linear-gradient(180deg,
    transparent 42%, rgba(62,224,255,.5) 49%, rgba(255,255,255,.75) 50%,
    rgba(62,224,255,.5) 51%, transparent 58%);
  background-size:100% 220%;
  mix-blend-mode:screen;
}
.orb:hover .scan{opacity:1;animation:sweep 2.1s linear infinite}
@keyframes sweep{
  from{background-position:50% 130%}
  to{background-position:50% -110%}
}

/* ───────── 名牌 ───────── */
.plate{
  margin-top:clamp(4px,1.2vh,16px);width:100%;max-width:330px;
  opacity:0;transform:translateY(8px);
  transition:opacity .5s .08s, transform .5s .08s;
}
.card.active .plate{opacity:1;transform:none}

.pl-top{
  display:flex;align-items:center;gap:9px;
  font-size:9.5px;letter-spacing:.24em;color:var(--dim);
}
.pl-top .gno{
  font-family:var(--tech);font-weight:700;font-size:11px;letter-spacing:.14em;
  color:var(--steel-0);background:var(--accent);padding:2px 7px;
  clip-path:polygon(0 0,100% 0,100% 72%,calc(100% - 6px) 100%,0 100%);
}
.pl-top .ln{flex:1;height:1px;background:var(--line)}

.pl-name{
  margin-top:11px;
  font-family:var(--tech);font-weight:700;
  font-size:clamp(23px,2.9vw,34px);line-height:1.1;
  letter-spacing:.07em;text-transform:uppercase;
}
.pl-cn{
  margin-top:5px;font-family:var(--han);font-weight:400;
  font-size:13px;letter-spacing:.14em;color:rgba(223,231,239,.8);
}
.pl-bar{
  margin-top:13px;height:3px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;
}
.pl-bar i{position:absolute;left:0;top:0;height:100%;background:var(--accent);
  box-shadow:0 0 10px var(--accent);transition:width .6s cubic-bezier(.2,.9,.2,1)}

/* ───────── 右侧参数面板 ───────── */
.spec{
  position:fixed;right:clamp(14px,2.6vw,34px);bottom:78px;
  z-index:8;width:234px;padding:16px 16px 18px;
  background:linear-gradient(180deg, rgba(28,35,45,.84), rgba(16,20,26,.84));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 18px 40px rgba(0,0,0,.6);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
  backdrop-filter:blur(8px);
}
.spec h2{
  font-family:var(--tech);font-weight:700;font-size:10px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--cyan);
  padding-bottom:9px;border-bottom:1px solid var(--line);
}
.row{margin-top:13px}
.row .k{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:9.5px;letter-spacing:.14em;color:var(--dim);
}
.row .k em{font-style:normal;font-family:var(--tech);font-weight:500;font-size:12px;color:var(--text);letter-spacing:.06em}
.row .t{margin-top:5px;height:2px;background:rgba(255,255,255,.07);position:relative}
.row .t i{position:absolute;left:0;top:0;height:100%;background:var(--cyan);
  transition:width .7s cubic-bezier(.2,.9,.2,1)}
.row.acc .t i{background:var(--accent)}
.spec .note{
  margin-top:15px;padding-top:11px;border-top:1px solid var(--line);
  font-family:var(--han);font-size:10.5px;line-height:1.8;color:rgba(223,231,239,.42);
}

/* ───────── 底部分段进度 ───────── */
.segbar{
  position:fixed;left:0;right:0;bottom:0;z-index:8;
  height:58px;padding:0 clamp(14px,2.6vw,30px);
  display:flex;align-items:center;gap:clamp(4px,.8vw,9px);
  background:linear-gradient(0deg, rgba(19,24,32,.94), rgba(19,24,32,.35));
  border-top:1px solid var(--line);backdrop-filter:blur(10px);
}
.seg{
  flex:1;background:none;border:none;padding:0;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;align-items:stretch;
}
.seg .b{height:4px;background:rgba(255,255,255,.08);transition:background .35s, box-shadow .35s}
.seg .n{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--faint);
  text-align:left;transition:color .35s;
}
.seg:hover .b{background:rgba(255,255,255,.2)}
.seg.done .b{background:rgba(62,224,255,.32)}
.seg.on .b{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.seg.on .n{color:var(--text)}

/* ───────── 左右按钮 ───────── */
.nav{
  position:fixed;top:50%;z-index:8;transform:translateY(-50%);
  width:34px;height:52px;cursor:pointer;color:var(--text);
  background:linear-gradient(180deg,rgba(32,40,51,.8),rgba(18,23,30,.8));
  border:1px solid var(--line);
  display:grid;place-items:center;font-size:13px;
  transition:border-color .3s,color .3s,opacity .3s;
}
.nav:hover{border-color:var(--line-hot);color:var(--cyan)}
.nav[disabled]{opacity:.22;cursor:default}
.nav.prev{left:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.nav.next{right:0}

@media (max-width:900px){ .spec{display:none} }
@media (max-width:640px){
  .nav{display:none}
  .reticle{width:clamp(230px,74vw,320px);transform:translate(-50%,calc(-50% - 38px))}
  .sys-sub{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.12s!important}
  .orb:hover .spin,.orb:hover .scan{animation:none}
  .orb-in{animation:none}
}
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<header>
  <div class="sys-l">
    <span class="dot"></span>
    <span class="sys-title">Metal Grades</span>
    <span class="sys-sub">金属材质 · 等级索引</span>
  </div>
  <div class="sys-r">
    <span>grade</span>
    <span class="counter"><b id="cNow">01</b> / 09</span>
  </div>
</header>

<div class="reticle" id="reticle">
  <div class="brk tl"></div><div class="brk tr"></div>
  <div class="brk bl"></div><div class="brk br"></div>
  <div class="xh h"></div><div class="xh v"></div>
  <div class="ring">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="96" fill="none" stroke="rgba(62,224,255,.3)"
              stroke-width=".8" stroke-dasharray="2 10"/>
      <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(150,180,210,.14)"
              stroke-width=".6" stroke-dasharray="26 180" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="ring2">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(150,180,210,.2)"
              stroke-width=".6" stroke-dasharray="1 7"/>
    </svg>
  </div>
</div>

<main class="stage" id="stage">
  <div class="track" id="track"></div>
</main>

<aside class="spec" id="spec">
  <h2>Material Readout</h2>
  <div class="row"><div class="k"><span>density 密度</span><em id="v0">—</em></div><div class="t"><i id="b0"></i></div></div>
  <div class="row"><div class="k"><span>reflectance 反射率</span><em id="v1">—</em></div><div class="t"><i id="b1"></i></div></div>
  <div class="row"><div class="k"><span>conductance 导能</span><em id="v2">—</em></div><div class="t"><i id="b2"></i></div></div>
  <div class="row acc"><div class="k"><span>rarity 稀有度</span><em id="v3">—</em></div><div class="t"><i id="b3"></i></div></div>
  <p class="note" id="note">—</p>
</aside>

<button class="nav prev" id="prev" aria-label="上一级">&#10094;</button>
<button class="nav next" id="next" aria-label="下一级">&#10095;</button>

<nav class="segbar" id="segbar"></nav>

<div class="scanlines"></div>
<div class="edge"></div>

<script>
(function(){
  "use strict";

  /* 主色取自各张图的实际像素采样，略提饱和用于氛围光 */
  const TIERS=[
    { img:"a.png", en:"Cast Iron",       cn:"铸铁",     sub:"Fe-C",        accent:"#d08a52",
      note:"最粗的底子，浇出来就定型，内环还留着铸造余温。" },
    { img:"b.png", en:"Stainless Steel", cn:"不锈钢",   sub:"Fe-Cr-Ni",    accent:"#8fa0b4",
      note:"加了铬，第一次有了不会生锈的表面。" },
    { img:"c.png", en:"Copper",          cn:"紫铜",     sub:"Cu",          accent:"#c65c30",
      note:"纯度上来了，导电和导热都排在最前面。" },
    { img:"d.png", en:"Brass",           cn:"黄铜",     sub:"Cu-Zn",       accent:"#e0a94b",
      note:"掺锌变硬，颜色也跟着亮起来。" },
    { img:"e.png", en:"Rose Gold",       cn:"玫瑰金",   sub:"Au-Cu",       accent:"#ce8068",
      note:"金里掺铜，硬度和颜色一起换掉。" },
    { img:"f.png", en:"Bronze",          cn:"青铜",     sub:"Cu-Sn",       accent:"#a89068",
      note:"掺锡，耐磨也耐蚀，能用很久。" },
    { img:"g.png", en:"Tungsten",        cn:"钨钢",     sub:"WC-Co",       accent:"#7d8b9c",
      note:"硬到不好加工，常规刀具几乎磨不动。" },
    { img:"h.png", en:"Titanium",        cn:"钛合金",   sub:"Ti-6Al-4V",   accent:"#3d86e0",
      note:"轻、强、耐腐蚀，阳极氧化出这身蓝。" },
    { img:"i.png", en:"Niobium",         cn:"铌",       sub:"Nb",          accent:"#b04ae8",
      note:"阳极氧化能调出整条光谱，等级到顶。" }
  ];

  /* 指标随等级单调上升，带轻微起伏；仅作示意 */
  function metrics(i){
    const t=i/(TIERS.length-1);
    const wob=function(k){ return Math.sin((i+1)*k)*.045; };
    return [
      Math.min(.99,.22+t*.7+wob(2.1)),
      Math.min(.99,.14+t*.8+wob(3.4)),
      Math.min(.99,.18+t*.74+wob(1.7)),
      (i+1)/TIERS.length
    ];
  }

  const track=document.getElementById('track');
  const segbar=document.getElementById('segbar');
  const stage=document.getElementById('stage');
  const reticle=document.getElementById('reticle');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  const cNow=document.getElementById('cNow');
  const note=document.getElementById('note');

  TIERS.forEach(function(t,i){
    const card=document.createElement('article');
    card.className='card';
    card.style.setProperty('--accent',t.accent);
    const pad=('0'+(i+1)).slice(-2);
    card.innerHTML=''
      +'<div class="orb" tabindex="0" role="img" aria-label="第'+(i+1)+'级 '+t.en+' '+t.cn+'">'
      +  '<div class="glow"></div>'
      +  '<div class="orb-in" style="animation-delay:'+(i*.5).toFixed(2)+'s">'
      +    '<div class="spin"><img src="'+t.img+'" alt="" draggable="false" decoding="async"></div>'
      +    '<div class="scan" style="mask-image:url('+t.img+');-webkit-mask-image:url('+t.img+')"></div>'
      +  '</div>'
      +'</div>'
      +'<div class="plate">'
      +  '<div class="pl-top"><span class="gno">G'+pad+'</span><span class="ln"></span><span>grade '+pad+'</span></div>'
      +  '<div class="pl-name">'+t.en+'</div>'
      +  '<div class="pl-cn">'+t.cn+'（'+t.sub+'）</div>'
      +  '<div class="pl-bar"><i style="width:'+Math.round((i+1)/TIERS.length*100)+'%"></i></div>'
      +'</div>';
    track.appendChild(card);

    const seg=document.createElement('button');
    seg.className='seg';
    seg.innerHTML='<span class="b"></span><span class="n">'+pad+'</span>';
    seg.setAttribute('aria-label','跳到第 '+(i+1)+' 级');
    seg.addEventListener('click',function(){ go(i); });
    segbar.appendChild(seg);
  });

  const cards=Array.prototype.slice.call(track.children);
  const segs=Array.prototype.slice.call(segbar.children);

  var idx=0, dragging=false, startX=0, startShift=0, shift=0, lockT=null;

  /* offsetWidth：不能用 getBoundingClientRect，它会把 scale 算进去 */
  function step(){ return cards[0]?cards[0].offsetWidth:320; }

  function layout(animate){
    const s=step(), w=stage.clientWidth||window.innerWidth;
    shift=w/2-(idx*s+s/2);
    track.classList.toggle('nosnap',animate===false);
    track.style.transform='translateX('+shift.toFixed(2)+'px)';
  }

  function paint(){
    const t=TIERS[idx];
    cards.forEach(function(c,i){
      const d=Math.abs(i-idx);
      c.classList.toggle('active',d===0);
      c.classList.toggle('near',d===1);
    });
    segs.forEach(function(s,i){
      s.classList.toggle('on',i===idx);
      s.classList.toggle('done',i<idx);
    });

    document.documentElement.style.setProperty('--accent',t.accent);
    const h=t.accent.replace('#','');
    const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
    document.documentElement.style.setProperty('--accent-soft','rgba('+r+','+g+','+b+',.34)');

    cNow.textContent=('0'+(idx+1)).slice(-2);
    note.textContent=t.note;

    const m=metrics(idx);
    for (var k=0;k<4;k++){
      document.getElementById('b'+k).style.width=(m[k]*100).toFixed(1)+'%';
      document.getElementById('v'+k).textContent=(m[k]*100).toFixed(0).padStart(2,'0');
    }

    prevBtn.disabled=idx===0;
    nextBtn.disabled=idx===TIERS.length-1;

    reticle.classList.remove('lock');
    void reticle.offsetWidth;
    reticle.classList.add('lock');
    clearTimeout(lockT);
    lockT=setTimeout(function(){ reticle.classList.remove('lock'); },460);
  }

  function go(n,animate){
    idx=Math.max(0,Math.min(TIERS.length-1,n));
    layout(animate); paint();
  }

  prevBtn.addEventListener('click',function(){ go(idx-1); });
  nextBtn.addEventListener('click',function(){ go(idx+1); });

  cards.forEach(function(c,i){
    const orb=c.querySelector('.orb');
    orb.addEventListener('click',function(){ if(i!==idx) go(i); });
    orb.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(i); }
    });
  });

  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); go(idx+1); }
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); go(idx-1); }
    else if(e.key==='Home'){ go(0); }
    else if(e.key==='End'){ go(TIERS.length-1); }
  });

  var wheelLock=false;
  stage.addEventListener('wheel',function(e){
    const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    if (Math.abs(d)<12||wheelLock) return;
    e.preventDefault(); wheelLock=true;
    go(idx+(d>0?1:-1));
    setTimeout(function(){ wheelLock=false; },400);
  },{passive:false});

  stage.addEventListener('pointerdown',function(e){
    if (e.button!==undefined&&e.button!==0) return;
    dragging=true; startX=e.clientX; startShift=shift;
    stage.classList.add('dragging');
    stage.setPointerCapture&&stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove',function(e){
    if(!dragging) return;
    track.classList.add('nosnap');
    track.style.transform='translateX('+(startShift+(e.clientX-startX)).toFixed(2)+'px)';
  });
  function endDrag(e){
    if(!dragging) return;
    dragging=false; stage.classList.remove('dragging');
    const dx=((e&&e.clientX)||startX)-startX;
    if (Math.abs(dx)>step()*.14) go(idx+(dx<0?1:-1));
    else go(idx);
  }
  stage.addEventListener('pointerup',endDrag);
  stage.addEventListener('pointercancel',endDrag);
  stage.addEventListener('pointerleave',function(e){ if(dragging) endDrag(e); });

  window.addEventListener('resize',function(){
    layout(false); requestAnimationFrame(function(){ layout(true); });
  });

  go(0,false);
  requestAnimationFrame(function(){ layout(true); paint(); });
})();
</script>
</body>
</html>
